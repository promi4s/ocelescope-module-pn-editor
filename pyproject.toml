[project]
name = "ocelescope-instance"
version = "0.10.3"
description = "An Ocelescope instance: the published backend host plus local modules"
requires-python = ">=3.11"
# `pnpm run add:backend` adds local backend modules here.
dependencies = [
  "ocelescope-backend>=0.11.0,<0.12.0",
  "ocelescope-module-ocel>=0.11.0,<0.12.0",
  "ocelescope-module-ocpn-editor",
  "ocelescope-module-filter>=0.11.0,<0.12.0"
]

[tool.uv.workspace]
members = ["backend-modules/*"]

[tool.uv.sources]
ocelescope-module-ocpn-editor = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
extend-exclude = ["data"]
